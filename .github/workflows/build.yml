name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MudKanban.slnx

      - name: Build
        run: dotnet build src/MudKanban.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/MudKanban.Tests/MudKanban.Tests.csproj --no-build --configuration Release --verbosity normal
