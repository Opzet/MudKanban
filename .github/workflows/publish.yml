name: Publish NuGet Package

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MudKanban/MudKanban.csproj

      - name: Build
        run: dotnet build src/MudKanban/MudKanban.csproj --no-restore --configuration Release

      - name: Pack
        run: dotnet pack src/MudKanban/MudKanban.csproj --no-build --configuration Release -p:PackageVersion=${{ github.event.release.tag_name }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push src/MudKanban/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
